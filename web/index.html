<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark"><title>glade</title>
  <link rel="preload" href="/fonts/MonaSansVF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="sidebar-rail" aria-label="导航">
    <button id="toggle-tree" class="icon-button" title="文件夹" aria-label="显示或隐藏目录树" aria-expanded="true" aria-controls="sidebar" data-icon="files"></button>
    <span class="rail-brand" title="glade 本地媒体画廊" aria-label="glade" data-icon="image"></span>
  </nav>
  <button id="drawer-backdrop" aria-label="关闭目录树" tabindex="-1"></button>
  <aside id="sidebar" aria-label="文件夹">
    <div class="tree-heading"><strong>文件夹</strong><button id="refresh" class="icon-button" title="刷新目录和媒体" aria-label="刷新目录和媒体" data-icon="refresh"></button></div>
    <nav id="tree" aria-label="目录树"></nav>
    <footer><span id="root-name">glade</span><span>本地媒体画廊</span></footer>
  </aside>
  <div id="sidebar-resize" role="separator" aria-orientation="vertical" aria-label="调整目录树宽度" aria-valuemin="180" aria-valuemax="480" aria-valuenow="245" tabindex="0"></div>
  <main id="viewport">
    <header class="page-header"><nav id="breadcrumbs" aria-label="当前位置"></nav></header>
    <section class="content-panel" aria-label="媒体画廊">
      <div class="toolbar" aria-label="画廊设置">
        <span id="count" role="status"></span>
        <div class="toolbar-actions">
          <button id="smaller" class="icon-button" title="缩小缩略图" aria-label="缩小缩略图" data-icon="minimize"></button>
          <button id="larger" class="icon-button" title="放大缩略图" aria-label="放大缩略图" data-icon="maximize"></button>
          <details class="options" id="sort-menu">
            <summary class="icon-button" title="排序" aria-label="排序"><span data-icon="sort"></span></summary>
            <div class="menu"><span class="menu-heading">排序</span>
              <select id="sort" aria-label="排序"><option value="name-asc">名称 A–Z</option><option value="name-desc">名称 Z–A</option><option value="time-desc">修改时间：最新</option><option value="time-asc">修改时间：最早</option><option value="taken-desc">拍摄时间：最新</option><option value="taken-asc">拍摄时间：最早</option></select>
            </div>
          </details>
          <details class="options" id="view-menu">
            <summary class="icon-button" title="画廊选项" aria-label="画廊选项"><span data-icon="more"></span></summary>
            <div class="menu">
              <span class="menu-heading">画廊布局</span>
              <div class="segmented"><button id="masonry" aria-pressed="true">瀑布流</button><button id="rows" aria-pressed="false">等高行</button></div>
              <label class="size-label">缩略图大小<input id="size" type="range" min="120" max="440" step="20" value="200" aria-label="卡片大小"></label>
              <hr>
              <label><input id="recursive" type="checkbox">包含子目录</label>
              <label><input id="autoplay" type="checkbox">自动播放视频</label>
              <label><input id="hidden" type="checkbox">显示隐藏文件</label>
            </div>
          </details>
        </div>
      </div>
      <div id="notice" role="status"></div>
      <div class="gallery-body"><div id="gallery" aria-label="媒体画廊"></div><div id="empty" hidden></div><button id="more" hidden>加载更多</button><div id="sentinel"></div></div>
    </section>
  </main>
  <dialog id="viewer" aria-label="媒体预览"><div class="viewer-toolbar"><span id="viewer-name"></span><a id="original" target="_blank" rel="noopener">打开原文件 ↗</a><button id="close" class="icon-button" aria-label="关闭预览" data-icon="close"></button></div><button id="previous" class="viewer-nav icon-button" aria-label="上一个" data-icon="left"></button><div id="viewer-content"></div><button id="next" class="viewer-nav icon-button" aria-label="下一个" data-icon="right"></button><div id="viewer-position"></div></dialog>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
